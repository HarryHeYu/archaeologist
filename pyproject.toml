[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-archaeologist"
version = "0.1.0"
description = "Understand an unfamiliar repository in seconds: git archaeology + static analysis, no AI required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Repo Archaeologist" }]
keywords = ["git", "code-analysis", "repository", "archaeology", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
arch = "archaeologist.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
symbols = [
    "tree-sitter>=0.23",
    "tree-sitter-python", "tree-sitter-c", "tree-sitter-cpp",
    "tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-go",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
